<!doctype html>
<html lang="en"><head><base href="docs/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TF Pair Miner — results explorer</title><link rel="stylesheet" href="style.css"><link rel="icon" href="img/favicon.svg" type="image/svg+xml"><link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script></head>
<body>
<header>
  <a class="brand" onclick="go('home')" style="cursor:pointer" title="TFpairminer – home"><img src="img/logo_dark.svg" alt="TFpairminer" height="40"></a>
  <div class="searchbox"><input id="q" type="search" placeholder="Search a TF (JUN), a pair (JUN:FOS) or a cell type (cholangiocyte)…" autocomplete="off"><div id="ac" class="ac" hidden></div></div>
  <select id="run" title="Published run"></select>
  <nav><button data-mode="home">Explore</button><button data-mode="table">Table</button><button data-mode="info">Run info</button><button data-mode="about">About / Run</button></nav>
</header>
<div id="banner" class="banner" hidden></div>
<main id="app"><p class="muted">Loading data…</p></main>
<footer>Candidates are co-expression associations, not verified interactions. If no prior is recorded, that doesn't mean the pair doesn't interact. Code: <a href="https://github.com/double2strand/TFpairminer">double2strand/TFpairminer</a></footer>
<script src="app.js"></script>
</body></html>
