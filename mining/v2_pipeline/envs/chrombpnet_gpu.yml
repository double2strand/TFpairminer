# conda env create -f mining/v2_pipeline/envs/chrombpnet_gpu.yml   -> python.gpu / python.gpu_bin
# GPU nodes (CUDA 12 driver). Provides chrombpnet + macs3 + bedtools for de-novo training (stage 04) and
# tensorflow for contributions / ablations (stages 05, 06).  CPU-only variant: replace tensorflow[and-cuda] by tensorflow-cpu.
name: tfpm-v2-chrombpnet
channels: [conda-forge, bioconda]
dependencies:
  - python=3.10
  - numpy=1.26.4
  - scipy
  - pandas
  - numba
  - h5py
  - pyyaml>=6
  - anndata>=0.10
  - bedtools
  - samtools
  - tabix
  - ucsc-bedgraphtobigwig
  - ucsc-bedtobigbed
  - ucsc-bigwigtobedgraph
  - macs3
  - pip
  - pip:
      - tensorflow[and-cuda]==2.15.1
      - chrombpnet
      - modisco-lite
      - pyfaidx
