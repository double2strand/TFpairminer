# Sanger farm22 (LSF via wr v0.39) - TFpairminer v2 pipeline.
#   base: /lustre/scratch126/gengen/projects_v2/ncap_selex/tfpm  (conda prefixes envs/main, envs/rna; image containers/chrombpnet.sif)
#   ChromBPNet stages run inside kundajelab/chrombpnet (TF 2.8.0) via `apptainer exec --nv`.
#   Usage: ./tfpm v2 pipeline --config mining/v2_pipeline/config.farm22.yaml run --stage all --runner wr
out: ${TFPM_V2P_OUT:-/lustre/scratch126/gengen/projects_v2/ncap_selex/tfpm/v2p_out}     # all inputs, intermediates, logs, markers
manifest: mining/v2_pipeline/samples.tsv                # generated by sources/build_manifest.py (116 rows)
context_map: mining/v2_pipeline/context_map.tsv         # ATAC profile/cell type -> RNA context (exact|proxy)
only: []                                                # optional subset of profile_ids (or regexes) to run

python:                                                 # interpreters (conda envs from envs/*.yml)
  main: /lustre/scratch126/gengen/projects_v2/ncap_selex/tfpm/envs/main/bin/python        # motif scan, permutations, contribs on CPU, aggregate
  rna: /lustre/scratch126/gengen/projects_v2/ncap_selex/tfpm/envs/rna/bin/python      # cellxgene-census, tf_census, targeted_rna
  gpu: python                                           # unused: chrombpnet.container is set
  gpu_bin: ""                                          # unused in container mode

refs:
  genome_fasta_url: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/hg38.fa.gz
  genome_md5_url: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/md5sum.txt
  chrom_sizes_url: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/hg38.chrom.sizes
  jaspar_meme: mining/motif_cooccurrence/resources/JASPAR2024_CORE_vertebrates_non-redundant_pfms_meme.txt
  blacklist: mining/motif_cooccurrence/resources/hg38-blacklist.v2.bed.gz
  chroms: [chr1,chr2,chr3,chr4,chr5,chr6,chr7,chr8,chr9,chr10,chr11,chr12,chr13,chr14,chr15,chr16,chr17,chr18,chr19,chr20,chr21,chr22,chrX]
  # ChromBPNet fold_0 (ENCODE standard): test chr1,chr3,chr6; valid chr8,chr20; train = rest
  fold: {test: [chr1, chr3, chr6], valid: [chr8, chr20]}

motifs:                                   # stage 03: motif_cooccurrence.cli sample
  window_bp: 300
  max_windows: 20000
  min_cuts: 6
  min_rep_cuts: 2
  min_cells: 100                          # Corpus: cell types with >= this many cells become profiles
  motif_pvalue: 1.0e-4
  permutations: 999                       # full GC/accessibility-stratified permutations
  q: 0.05
  min_lift: 1.25

chrombpnet:
  pretrained: manifest                    # 'manifest' = use cbp_pretrained URL when present (ENCODE), else train
  force_pretrained: ""                    # path to one *nobias*.h5 used for EVERY profile (smoke test only)
  max_peaks: 300000
  bias_model: ""                          # optional published ATAC bias .h5 to skip bias training
  min_fragments: 2000000                  # skip de-novo training below this many fragments (reported as skipped)
  contrib_shards: 4
  pairs_shards: 4
  method: ig                              # ig | deepshap
  contrib_extra: ""                       # e.g. "--n-top 800 --steps 6"
  pairs_extra: "--min-windows 8 --ablate-windows 40 --seeds 2 --site-pct 0.75"
  modisco_max_seqlets: 20000
  container: /lustre/scratch126/gengen/projects_v2/ncap_selex/tfpm/containers/chrombpnet.sif
  module_load: "module load ISG/apptainer/1.4.0"
  container_binds: [/lustre/scratch126]     # repo + out are always bound; add others if inputs live elsewhere

rna:
  census_version: "2025-11-08"            # pinned CELLxGENE Census LTS release
  tabula_dataset_id: 53d208b0-2cfd-4366-9866-c3c6114081bc   # Tabula Sapiens "All Cells" in that release
  local_h5ad: ""                          # smoke/offline: CELLxGENE-schema h5ad instead of the Census
  thresholds: "--min-cells 100 --min-detection 0.05 --min-rho 0.25 --min-lift 1.1 --min-codetected 25 --max-q 0.05"
  strict:
    enabled: true                         # atlas-wide uncapped screens via tf_pair_evidence/run_remote.sh
    shards: 200                           # workers per screen (each SHARD_INDEX of NUM_SHARDS)

publish:
  dir: docs/v2/data                       # stage 10 copies the aggregated site here (never touches docs/ v1)
  commit: false                           # stage 10 never commits; see RUNBOOK 'Publish'

runner:
  local: {cpus: 32, mem_gb: 240, gpus: 0} # workstation mode (256 GB box): concurrency limited by these
  wr:
    rep_prefix: tfpm-v2                   # wr -i <prefix>-<stage>
    queue: normal                         # CPU default (<=12h); per-stage "queue" below overrides
    gpu_queue: gpu
    gpu_misc: '-gpu "num=1"'              # passed to bsub via wr add --misc (wr itself adds -M/-R mem)
    retries: 2
    poll_seconds: 60
    override: higher                          # wr add -o (e.g. higher) so learned values never undercut these resources

# per stage resources: cpus, mem (GB), time, gpu (0/1). Used for wr -c/-m/-t and local concurrency.
resources:
  "00": {cpus: 1, mem: 2, time: 30m}
  "01": {cpus: 2, mem: 4, time: 10h}
  "02": {cpus: 8, mem: 64, time: 24h, queue: long}
  "03": {cpus: 8, mem: 32, time: 24h, queue: long}
  "03b": {cpus: 2, mem: 16, time: 2h}
  "04": {cpus: 8, mem: 64, time: 72h, gpu: 1, queue: gpu-basement}   # de-novo training is the long pole
  "05": {cpus: 4, mem: 32, time: 12h, gpu: 1, queue: gpu}
  "05b": {cpus: 8, mem: 32, time: 10h}
  "06": {cpus: 4, mem: 32, time: 12h, gpu: 1, queue: gpu}
  "06b": {cpus: 1, mem: 8, time: 1h}
  "07a": {cpus: 2, mem: 16, time: 4h}
  "07": {cpus: 2, mem: 16, time: 24h, queue: long}
  "07b": {cpus: 2, mem: 16, time: 4h}
  "08a": {cpus: 2, mem: 16, time: 4h}
  "08": {cpus: 2, mem: 16, time: 24h, queue: long}
  "08b": {cpus: 2, mem: 16, time: 4h}
  "09": {cpus: 2, mem: 16, time: 4h}
  "10": {cpus: 2, mem: 16, time: 2h}
  "11": {cpus: 1, mem: 4, time: 30m}
