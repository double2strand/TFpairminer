<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="340" height="72" role="img" aria-label="TFpairminer">
  <title>TFpairminer</title>
  <g transform="translate(4,4)"><defs>
    <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="gB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
  </defs>
  <!-- DNA double helix (two backbones + base-pair rungs) -->
  <g stroke-linecap="round">
    <g stroke="#94a3b8" stroke-width="1.6">
      <line x1="8" y1="44" x2="8" y2="56"/><line x1="16" y1="42.5" x2="16" y2="57.5"/><line x1="24" y1="45" x2="24" y2="55"/>
      <line x1="40" y1="45" x2="40" y2="55"/><line x1="48" y1="42.5" x2="48" y2="57.5"/><line x1="56" y1="44" x2="56" y2="56"/>
    </g>
    <path d="M2 50 C 9 38, 17 38, 24 50 S 39 62, 46 50 S 57 38, 62 44" fill="none" stroke="#1d2330" stroke-width="3"/>
    <path d="M2 50 C 9 62, 17 62, 24 50 S 39 38, 46 50 S 57 62, 62 56" fill="none" stroke="#64748b" stroke-width="3"/>
  </g>
  <!-- bZIP-like dimer: two alpha-helices meeting in a leucine zipper, basic regions gripping the major groove -->
  <path d="M31 6 C 27 16, 22 30, 17 47" fill="none" stroke="url(#gA)" stroke-width="8" stroke-linecap="round"/>
  <path d="M33 6 C 37 16, 42 30, 47 47" fill="none" stroke="url(#gB)" stroke-width="8" stroke-linecap="round"/>
  <!-- helical turns -->
  <g stroke="#fff" stroke-opacity=".55" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M27 13 l5 2"/><path d="M25.5 20 l5 2"/><path d="M23.5 27 l5 2"/><path d="M21.5 34 l5 2"/>
    <path d="M37 13 l-5 2"/><path d="M38.5 20 l-5 2"/><path d="M40.5 27 l-5 2"/><path d="M42.5 34 l-5 2"/>
  </g>
  <!-- leucine-zipper contacts -->
  <g fill="#fde68a" stroke="#1d2330" stroke-width=".6"><circle cx="32" cy="9" r="1.6"/><circle cx="32" cy="15" r="1.6"/></g>
</g>
  <text x="78" y="44" font-family="Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5"><tspan fill="#1d4ed8">TF</tspan><tspan fill="#ea580c">pair</tspan><tspan fill="#1d2330">miner</tspan></text>
  <text x="80" y="62" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" fill="#64748b" letter-spacing="0.6">TF PAIRS × CELL TYPES · RNA · ATAC</text>
</svg>
